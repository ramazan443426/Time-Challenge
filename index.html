<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Time Challenge</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3fa;font:16px system-ui,sans-serif;color:#20354c}main{max-width:440px;margin:auto;padding:16px}section{background:white;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 3px 15px #20354c12}h1{font-size:26px;margin:0;color:#2058a5;text-align:center}p{text-align:center;margin:8px 0}svg{display:block;width:min(100%,300px);margin:auto}button,select{font:inherit;border-radius:10px;padding:12px;border:1px solid #b8c8da;background:white;color:inherit;min-height:44px}button{cursor:pointer;font-weight:650}button:disabled{opacity:.5}button.primary{background:#2459ad;color:white;border:0;width:100%}.row{display:flex;gap:8px;margin:10px 0}.row>*{flex:1;min-width:0}label{display:grid;gap:5px;font-size:14px}select{width:100%}#answer{text-align:center;background:#e5f4e9;padding:15px;border-radius:12px;margin-top:12px;font-size:21px;color:#17683c;font-weight:700}#score{text-align:center;font-weight:bold}.good{background:#dff3e5;color:#17683c}.bad{background:#fce5e5;color:#a52b2b}small{display:block;text-align:center;color:#52677d} [hidden]{display:none!important}</style><main><section><h1>WHAT TIME IS IT?</h1><p>Family Time Challenge</p><svg id="clock" viewBox="0 0 300 300" role="img" aria-label="Analog saat"></svg><small>🔴 Hour hand · 🔵 Minute hand</small></section><section><label>Zorluk seviyesi<select id="level"><option value="easy">Easy – Tam ve buçuk</option><option value="medium" selected>Medium – Tam, buçuk ve çeyrek</option><option value="advanced">Advanced – Tüm dakikalar</option></select></label><div class="row"><label>Saat / Hour<select id="h"></select></label><label>Dakika / Minute<select id="m"></select></label></div><button id="random" style="width:100%">🔀 Random Time / Yeni soru</button><p><strong>What time is it?</strong></p><small>Saate bak, İngilizce söyle ve kontrol et.</small><button class="primary" id="reveal" style="margin-top:12px">SHOW ANSWER · Cevabı göster</button><div id="answer" hidden><div id="digital"></div><small>Traditional / Geleneksel okunuş</small><p id="sentence"></p><button id="listen">🔊 Listen / Dinle</button><hr style="border:0;border-top:1px solid #b6d5bf;margin:15px 0"><small>Digital / Dijital okunuş</small><p id="digitalSentence"></p><button id="listenDigital">🔊 Listen / Dinle</button><small id="voiceStatus"></small></div></section><section><small>Veli değerlendirmesi</small><div class="row"><button class="good" id="correct" disabled>✓ Correct</button><button class="bad" id="wrong" disabled>✗ Incorrect</button></div><p id="score"></p><button id="reset" style="width:100%">Sayacı sıfırla</button></section><small>Üyelik gerekmez. Sonuçlar bu oturumda kalır.</small></main><script>
const $=id=>document.getElementById(id), h=$('h'),m=$('m'),level=$('level');let good=0,bad=0,graded=false,shown=false;const words=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven'], nums=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty','twenty-one','twenty-two','twenty-three','twenty-four','twenty-five','twenty-six','twenty-seven','twenty-eight','twenty-nine'];function options(el,values){el.replaceChildren(...values.map(v=>new Option(String(v).padStart(2,'0'),v)))}options(h,Array.from({length:12},(_,i)=>i+1));function allowed(){return level.value==='easy'?[0,30]:level.value==='medium'?[0,15,30,45]:Array.from({length:60},(_,i)=>i)}function answer(H,M){let w=words[H%12];if(!M)return `It is ${w} o'clock.`;if(M===30)return `It is half past ${w}.`;let n=M<30?M:60-M;let a=n===15?'a quarter':nums[n];return `It is ${a} ${M<30?'past':'to'} ${words[(H+(M>30?1:0))%12]}.`}
function digitalAnswer(H,M){let w=words[H%12];let d=M===0?"o’clock":M<10?"oh "+nums[M]:M<30?nums[M]:["thirty","forty","fifty"][Math.floor(M/10)-3]+(M%10?"-"+nums[M%10]:"");return `It is ${w} ${d}.`}
function draw(){let H=+h.value,M=+m.value;let s='<circle cx="150" cy="150" r="140" fill="#3478bd"/><circle cx="150" cy="150" r="129" fill="white"/>';function point(a,r){return [150+Math.sin(a)*r,150-Math.cos(a)*r]}function line(a,r1,r2,c,w){let [x,y]=point(a,r1),[u,v]=point(a,r2);return `<line x1="${x}" y1="${y}" x2="${u}" y2="${v}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`}for(let i=0;i<60;i++)s+=line(i*Math.PI/30,i%5?116:108,122,'#40556b',i%5?1:3);for(let i=1;i<=12;i++){let [x,y]=point(i*Math.PI/6,91);s+=`<text x="${x}" y="${y+8}" text-anchor="middle" font-size="24" font-weight="bold" fill="#20354c">${i}</text>`}s+=line((H+M/60)*Math.PI/6,0,62,'#dc4040',10)+line(M*Math.PI/30,0,102,'#205cb8',6)+'<circle cx="150" cy="150" r="8" fill="#20354c"/>';$('clock').innerHTML=s;$('digital').textContent=h.value.padStart(2,'0')+':'+m.value.padStart(2,'0');$('sentence').textContent=answer(H,M);$('digitalSentence').textContent=digitalAnswer(H,M)}function refresh(){shown=false;graded=false;draw();display();if(window.speechSynthesis) speechSynthesis.cancel()}function display(){$('answer').hidden=!shown;$('reveal').textContent=shown?'HIDE ANSWER · Cevabı gizle':'SHOW ANSWER · Cevabı göster';$('correct').disabled=$('wrong').disabled=!shown||graded;$('score').textContent=`Doğru: ${good}  ·  Yanlış: ${bad}  ·  Başarı: ${good+bad?Math.round(100*good/(good+bad)):0}%`};function changeLevel(){let old=+m.value;options(m,allowed());if(allowed().includes(old))m.value=old;refresh()}level.onchange=changeLevel;h.onchange=m.onchange=refresh;$('random').onclick=()=>{let a=allowed(),old=+h.value*60 + +m.value,H,M;do{H=1+Math.floor(Math.random()*12);M=a[Math.floor(Math.random()*a.length)]}while(H*60+M===old);h.value=H;m.value=M;refresh()};$('reveal').onclick=()=>{shown=!shown;display()};$('correct').onclick=()=>{if(!graded&&shown){good++;graded=true;display()}};$('wrong').onclick=()=>{if(!graded&&shown){bad++;graded=true;display()}};$('reset').onclick=()=>{good=bad=0;display()};function speak(id){if(!window.speechSynthesis){$('voiceStatus').textContent='Bu tarayıcı sesli okumayı desteklemiyor.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($(id).textContent);u.lang='en-GB';u.rate=.8;u.onerror=()=>{$('voiceStatus').textContent='Sesli okuma kullanılamadı.'};$('voiceStatus').textContent='';speechSynthesis.speak(u)};$('listen').onclick=()=>speak('sentence');$('listenDigital').onclick=()=>speak('digitalSentence');h.value=8;changeLevel();m.value=30;refresh();
</script></html>
